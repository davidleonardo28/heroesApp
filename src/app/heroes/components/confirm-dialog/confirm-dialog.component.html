<h1 mat-dialog-title class="dialog-title">¿Está seguro que desea eliminar?</h1>

<div mat-dialog-content class="dialog-content">
  <p>
    Esta acción <strong>no se puede deshacer</strong>. Está a punto de eliminar
    a <strong>{{ data.superhero }}</strong
    >.
  </p>
  <mat-icon class="warning-icon" color="warn">warning</mat-icon>
</div>

<div mat-dialog-actions class="dialog-actions" align="end">
  <button mat-button (click)="onNoClick()" class="cancel-button">
    Cancelar
  </button>
  <button mat-raised-button color="warn" (click)="onConfirm()" cdkFocusInitial>
    Eliminar
  </button>
</div>
